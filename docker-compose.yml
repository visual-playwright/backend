# AutoQA production: backend saja.
# TLS + port 80/443 dipegang nginx HOST (bukan Caddy) — pola sama seperti
# bearich (proxy_pass ke 127.0.0.1:<port>). DNS diatur manual ke IP publik VM.
# DB: container global-mysql di network eksternal global-network,
# diakses via DB_HOST=global-mysql.
services:
  autoqa:
    build: .
    env_file: .env
    ports:
      # Localhost saja (ikuti pola bearich 127.0.0.1:4000) — publik via nginx host.
      - "127.0.0.1:5002:5002"
    environment:
      # Samakan path kerja OpenCode dengan layout container (lihat aiService.js).
      OPENCODE_DIR: /app
      OPENCODE_CWD: /app
    volumes:
      # Screenshot run — persistensi di luar lapisan image.
      - autoqa-storage:/app/storage
      # Auth CLI OpenCode milik user VM (read-only, JANGAN di-bake ke image).
      # Sesuaikan sisi kiri bila HOME Anda bukan /home/<user> (cek: echo $HOME).
      # Config tetap RO (kredensial aman); share RW karena CLI wajib menulis
      # data sesi di sana (flag -s sessionId di aiService.js) — RO = EROFS.
      - ~/.config/opencode:/home/runner/.config/opencode:ro
      - ~/.local/share/opencode:/home/runner/.local/share/opencode:rw
    restart: unless-stopped
    networks:
      - global-network

networks:
  global-network:
    external: true

volumes:
  autoqa-storage:
